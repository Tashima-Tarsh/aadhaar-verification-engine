[project]
name = "aadhaar-verification-platform"
version = "1.0.0"
description = "Enterprise-grade Aadhaar Offline Verification, Risk & Identity Intelligence Platform"
authors = [
    { name = "Platform Engineering — FinTech Division" }
]
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Auth / crypto
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",

    # Task queue
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",

    # Storage
    "boto3>=1.34.0",

    # Document processing
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "pyzbar>=0.1.9",
    "zxing-cpp>=2.2.0",
    "scikit-image>=0.22.0",
    "deskew>=1.5.0",
    "PyMuPDF>=1.24.0",
    "pikepdf>=8.15.0",
    "pyzipper>=0.3.6",
    "lxml>=5.2.0",

    # ML-based QR (optional but recommended)
    "qreader>=1.7.0",

    # Logging / monitoring
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",

    # Reporting
    "pandas>=2.2.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
liveness = [
    "deepface>=0.0.93",
    "tf-keras>=2.16.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "testcontainers[postgresql,redis]>=4.4.0",
    "hypothesis>=6.100.0",
    "locust>=2.28.0",
    "bandit>=1.7.8",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
