<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aadhaar Verification Platform</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 700; color: #f8fafc; }
  header span { background: #3b82f6; color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; margin-bottom: 24px; }
  .card h2 { font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; }
  .setup-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .setup-row input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #f1f5f9; font-size: 14px; }
  .setup-row input::placeholder { color: #475569; }
  button { background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2563eb; }
  button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .drop-zone { border: 2px dashed #334155; border-radius: 12px; padding: 48px; text-align: center; cursor: pointer; margin-bottom: 16px; }
  .drop-zone:hover { border-color: #3b82f6; background: #1e3a5f22; }
  .drop-zone p { color: #64748b; font-size: 15px; margin-top: 8px; }
  .drop-zone .icon { font-size: 48px; }
  .drop-zone .file-name { color: #3b82f6; font-weight: 600; margin-top: 8px; }
  .ref-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .ref-row input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #f1f5f9; font-size: 14px; }
  .result { display: none; }
  .result.show { display: block; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
  .badge.low { background: #14532d; color: #4ade80; }
  .badge.medium { background: #713f12; color: #fbbf24; }
  .badge.high { background: #7f1d1d; color: #f87171; }
  .badge.completed { background: #14532d; color: #4ade80; }
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .data-item { background: #0f172a; border-radius: 8px; padding: 12px 16px; }
  .data-item label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
  .data-item span { font-size: 15px; color: #f1f5f9; font-weight: 500; }
  .status-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .spinner { width: 20px; height: 20px; border: 2px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 14px; color: #94a3b8; }
  .error-box { background: #7f1d1d22; border: 1px solid #7f1d1d; border-radius: 8px; padding: 14px; color: #f87171; font-size: 14px; margin-top: 12px; }
  .success-box { background: #14532d22; border: 1px solid #14532d; border-radius: 8px; padding: 14px; font-size: 14px; margin-top: 12px; }
  .api-link { color: #3b82f6; text-decoration: none; font-size: 13px; }
  .key-box { background: #0f172a; border: 1px solid #3b82f6; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; color: #60a5fa; word-break: break-all; margin-top: 12px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; color: #64748b; border: 1px solid transparent; }
  .tab.active { background: #1e3a5f; color: #60a5fa; border-color: #3b82f6; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .address-block { background: #0f172a; border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 14px; color: #cbd5e1; line-height: 1.6; }
  .qr-valid { color: #4ade80; } .qr-invalid { color: #f87171; }
</style>
</head>
<body>

<header>
  <div>🔐</div>
  <h1>Aadhaar Offline Verification Platform</h1>
  <span>OFFLINE</span>
</header>

<div class="container">

  <div class="card" id="setup-card">
    <h2>Connect Your Account</h2>
    <div class="setup-row">
      <input type="text" id="api-key-input" placeholder="Paste your API key (64 characters)" />
      <button onclick="saveKey()">Connect</button>
    </div>
    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
      <button onclick="createTenant()" style="background:#0f172a; border:1px solid #334155; font-size:13px; padding:6px 14px;">Create New Account</button>
      <a href="/api/docs" target="_blank" class="api-link">→ Open Swagger API Docs</a>
    </div>
    <div id="key-result"></div>
  </div>

  <div class="card" id="main-card" style="display:none;">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('verify')">Verify Aadhaar</div>
      <div class="tab" onclick="switchTab('reports')">Reports</div>
      <div class="tab" onclick="switchTab('account')">Account</div>
    </div>

    <div class="tab-content active" id="tab-verify">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="icon">📄</div>
        <p>Click to upload or drag & drop your Aadhaar document</p>
        <p style="font-size:12px; margin-top:4px;">JPG · PNG · PDF · XML</p>
        <div class="file-name" id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.pdf,.xml" style="display:none" onchange="fileSelected(this)">
      <div class="ref-row">
        <input type="text" id="ref-input" placeholder="Reference ID (e.g. CUST-001)" />
        <button onclick="verify()" id="verify-btn">Verify Now</button>
      </div>
      <div class="result" id="result-panel">
        <div class="status-bar" id="status-bar">
          <div class="spinner" id="spinner"></div>
          <span class="msg" id="status-msg">Submitting...</span>
        </div>
        <div id="result-content"></div>
      </div>
    </div>

    <div class="tab-content" id="tab-reports">
      <div style="display:flex; gap:12px; margin-bottom:16px; align-items:center;">
        <select id="days-select" style="background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 12px; color:#f1f5f9; font-size:14px;">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <button onclick="loadReports()">Refresh</button>
        <button onclick="exportCSV()" style="background:#0f172a; border:1px solid #334155;">Export CSV</button>
      </div>
      <div class="data-grid">
        <div class="data-item"><label>Total Verifications</label><span id="r-total">—</span></div>
        <div class="data-item"><label>Completed</label><span id="r-completed">—</span></div>
        <div class="data-item"><label>Failed</label><span id="r-failed">—</span></div>
        <div class="data-item"><label>Avg Processing Time</label><span id="r-avg">—</span></div>
      </div>
      <div class="data-item" style="margin-top:12px;"><label>Risk Breakdown</label><span id="r-risk">—</span></div>
    </div>

    <div class="tab-content" id="tab-account">
      <div class="data-item" style="margin-bottom:12px;"><label>Your API Key</label><div class="key-box" id="account-key"></div></div>
      <button onclick="logout()" style="background:#7f1d1d; margin-top:8px;">Disconnect</button>
    </div>
  </div>

</div>

<script>
const BASE = '';
let API_KEY = localStorage.getItem('aadhaar_api_key') || '';
let selectedFile = null;

window.onload = () => { if (API_KEY) showMain(); };

function saveKey() {
  const k = document.getElementById('api-key-input').value.trim();
  if (k.length < 10) { alert('Paste a valid API key'); return; }
  API_KEY = k; localStorage.setItem('aadhaar_api_key', k); showMain();
}

async function createTenant() {
  const name = prompt('Enter your company or your name:');
  if (!name) return;
  const r = await fetch('/api/v1/tenants', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name}) });
  const d = await r.json();
  if (d.api_key) {
    document.getElementById('key-result').innerHTML =
      `<div class="success-box">✅ Account created!<br><b>Your API Key (save this — shown only once):</b><div class="key-box">${d.api_key}</div><br><button onclick="document.getElementById('api-key-input').value='${d.api_key}';saveKey()">Use This Key →</button></div>`;
  } else {
    document.getElementById('key-result').innerHTML = `<div class="error-box">${JSON.stringify(d)}</div>`;
  }
}

function showMain() {
  document.getElementById('setup-card').style.display='none';
  document.getElementById('main-card').style.display='block';
  document.getElementById('account-key').textContent = API_KEY;
  loadReports();
}

function logout() {
  localStorage.removeItem('aadhaar_api_key'); API_KEY='';
  document.getElementById('setup-card').style.display='block';
  document.getElementById('main-card').style.display='none';
}

function switchTab(tab) {
  ['verify','reports','account'].forEach((t,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  if (tab==='reports') loadReports();
}

function fileSelected(input) {
  selectedFile = input.files[0];
  document.getElementById('file-name').textContent = '✅ ' + selectedFile.name + ' (' + (selectedFile.size/1024).toFixed(1) + ' KB)';
  if (!document.getElementById('ref-input').value)
    document.getElementById('ref-input').value = 'CUST-' + Date.now().toString().slice(-6);
}

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.style.borderColor='#3b82f6'; });
dz.addEventListener('dragleave', () => { dz.style.borderColor='#334155'; });
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.style.borderColor='#334155';
  selectedFile = e.dataTransfer.files[0];
  document.getElementById('file-name').textContent = '✅ ' + selectedFile.name;
});

async function verify() {
  if (!selectedFile) { alert('Select an Aadhaar file first.'); return; }
  const refId = document.getElementById('ref-input').value.trim() || 'CUST-' + Date.now();
  document.getElementById('verify-btn').disabled = true;
  document.getElementById('result-panel').className = 'result show';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('status-msg').textContent = 'Uploading...';
  document.getElementById('result-content').innerHTML = '';

  const form = new FormData();
  form.append('file', selectedFile);
  form.append('reference_id', refId);

  try {
    const r = await fetch('/api/v1/verify', { method:'POST', headers:{'X-API-Key':API_KEY}, body:form });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
    document.getElementById('status-msg').textContent = 'Processing... (checking every 2 seconds)';
    pollResult(d.request_id);
  } catch(e) { showError(e.message); }
}

async function pollResult(reqId) {
  for (let i=0; i<30; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const r = await fetch('/api/v1/verify/'+reqId+'/status', { headers:{'X-API-Key':API_KEY} });
      const d = await r.json();
      document.getElementById('status-msg').textContent = 'Status: ' + d.status + ' (' + (i*2) + 's)';
      if (d.status==='COMPLETED') { showResult(d); return; }
      if (d.status==='FAILED') { showError(d.error_message || 'Verification failed'); return; }
    } catch(e) {}
  }
  showError('Timeout — try again');
}

function showResult(d) {
  document.getElementById('spinner').style.display='none';
  document.getElementById('status-msg').textContent='Verification complete';
  document.getElementById('verify-btn').disabled=false;
  const riskClass=(d.risk_score||'').toLowerCase();
  const qr = d.qr_valid ? '<span class="qr-valid">✅ Valid</span>' : '<span class="qr-invalid">❌ Invalid</span>';
  let addr = '';
  if (d.address) {
    const a = d.address;
    addr = '<div class="address-block"><b>Address:</b><br>' + (typeof a==='string' ? a : [a.house,a.street,a.landmark,a.locality,a.city,a.district,a.state,a.pincode].filter(Boolean).join(', ')) + '</div>';
  }
  document.getElementById('result-content').innerHTML = `
    <div class="success-box">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
        <span class="badge completed">COMPLETED</span>
        <span class="badge ${riskClass}">${d.risk_score||'N/A'} RISK</span>
        <span style="color:#64748b;font-size:13px;">${d.processing_time_ms||0}ms</span>
      </div>
      <div class="data-grid">
        <div class="data-item"><label>Full Name</label><span>${d.name||'—'}</span></div>
        <div class="data-item"><label>Date of Birth</label><span>${d.dob||'—'}</span></div>
        <div class="data-item"><label>Gender</label><span>${d.gender||'—'}</span></div>
        <div class="data-item"><label>Masked Aadhaar</label><span>${d.masked_aadhaar||'—'}</span></div>
        <div class="data-item"><label>QR Signature</label><span>${qr}</span></div>
        <div class="data-item"><label>Image Quality</label><span>${d.image_quality_score?(d.image_quality_score*100).toFixed(0)+'%':'—'}</span></div>
      </div>${addr}
    </div>`;
}

function showError(msg) {
  document.getElementById('spinner').style.display='none';
  document.getElementById('verify-btn').disabled=false;
  document.getElementById('status-msg').textContent='Error';
  document.getElementById('result-content').innerHTML='<div class="error-box">❌ '+msg+'</div>';
}

async function loadReports() {
  if (!API_KEY) return;
  const days = document.getElementById('days-select')?.value||30;
  try {
    const r = await fetch('/api/v1/reports/summary?days='+days, {headers:{'X-API-Key':API_KEY}});
    const d = await r.json();
    document.getElementById('r-total').textContent = d.total_verifications??'—';
    document.getElementById('r-completed').textContent = d.completed??'—';
    document.getElementById('r-failed').textContent = d.failed??'—';
    document.getElementById('r-avg').textContent = d.avg_processing_time_ms ? d.avg_processing_time_ms.toFixed(0)+' ms':'—';
    const rb=d.risk_breakdown||{};
    document.getElementById('r-risk').textContent = Object.entries(rb).map(([k,v])=>k+': '+v).join(' · ')||'No data yet';
  } catch(e){}
}

function exportCSV() {
  window.open('/api/v1/reports/export/csv?days='+(document.getElementById('days-select')?.value||30), '_blank');
}
</script>
</body>
</html>
